name: Nightly APK

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Merge upstream
        id: merge
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git remote add upstream https://github.com/coredevices/mobileapp.git
          git fetch upstream
          before=$(git rev-parse HEAD)
          git merge --no-ff upstream/master --no-edit
          if ! git diff --quiet "$before" HEAD; then
            git checkout HEAD^ -- .github/workflows
            git add -A .github/workflows
            git commit --amend --no-edit --no-verify || true
            git push origin master || {
              git fetch origin
              git merge --no-edit origin/master
              git push origin master
            }
          fi
          echo "merge_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('gradle/**', 'gradlew*', 'gradle.properties', '*.gradle*') }}
          restore-keys: android-${{ runner.os }}-

      - name: Configure Firebase and signing
        run: |
          cp androidApp/src/google-services-dummy.json androidApp/src/google-services.json
          echo "LOCAL_RELEASE_BUILD=true" > local.properties

      - name: Build release APK
        run: |
          ./gradlew :androidApp:assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly build #${{ github.run_number }}
          body: |
            Automated APK build from [coredevices/mobileapp](https://github.com/coredevices/mobileapp).

            - Trigger: `${{ github.event_name }}`
            - Run: ${{ github.run_number }}
            - Commit: ${{ steps.merge.outputs.merge_sha }}
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
          fail_on_unmatched_files: true
